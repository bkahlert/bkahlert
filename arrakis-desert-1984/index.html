<body>
<main aria-label="Arrakis desert background comparison">
  <section aria-labelledby="webgl-title">
    <h1 id="webgl-title"><a href="webgl/index.html">WebGL</a></h1>

  </section>
  <section aria-labelledby="component-title">
    <h1 id="component-title"><a href="webcomponent/index.html">Web component</a></h1>
    <iframe src="webcomponent/index.html" title="Arrakis desert — web component background"></iframe>
  </section>
  <section aria-labelledby="svg-title">
    <h1 id="svg-title"><a href="svg/index.html">SVG</a></h1>
    <iframe src="svg/index.html" title="Arrakis desert — SVG background"></iframe>
  </section>
</main>

</html>
