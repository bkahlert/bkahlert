name: Rendering diagnostic
on:
  push:
    branches: [feat/arrakis-svg-background]
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arrakis-orbit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Compare WebKit rendering backends
        run: xvfb-run -a node ../.github/rendering-diagnostic.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rendering-diagnostic
          path: arrakis-orbit/test-results/
