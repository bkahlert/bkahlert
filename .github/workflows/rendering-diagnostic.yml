name: Rendering diagnostic
on:
  push:
    branches: [feat/arrakis-svg-background]
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arrakis-orbit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Compare WebKit rendering backends
        run: |
          xvfb-run -a node <<'JS'
          const { webkit } = require('playwright');
          const { PNG } = require('pngjs');
          const fs = require('node:fs/promises');
          (async () => {
            await fs.mkdir('test-results', { recursive: true });
            for (const headless of [true, false]) {
              const browser = await webkit.launch({ headless });
              try {
                const page = await browser.newPage({ viewport: { width: 400, height: 400 } });
                page.on('console', message => console.log('browser:', message.text()));
                page.on('pageerror', error => console.log('pageerror:', error.message));
                await page.route('http://diagnostic.test/**', async route => {
                  if (route.request().url().endsWith('.svg')) {
                    await route.fulfill({ contentType: 'image/svg+xml', body: '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><style>@keyframes move{from{transform:translateX(0)}to{transform:translateX(100px)}}rect{animation:move 2s linear infinite alternate}</style><rect width="60" height="200" fill="blue"/></svg>' });
                  } else {
                    await route.fulfill({ contentType: 'text/html', body: '<body style="margin:0;background:white"><canvas width="200" height="200"></canvas><div style="width:200px;height:200px;background-image:url(motion.svg)"></div></body>' });
                  }
                });
                await page.goto('http://diagnostic.test/');
                const state = await page.evaluate(() => {
                  const gl = document.querySelector('canvas').getContext('webgl', { preserveDrawingBuffer: true });
                  gl.clearColor(1, 0, 0, 1);
                  gl.clear(gl.COLOR_BUFFER_BIT);
                  const pixel = new Uint8Array(4);
                  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
                  return { pixel: Array.from(pixel), error: gl.getError(), visibility: document.visibilityState };
                });
                const first = await page.screenshot({ path: `test-results/${headless}-first.png` });
                await page.waitForTimeout(1200);
                const later = await page.screenshot({ path: `test-results/${headless}-later.png` });
                const png = PNG.sync.read(first);
                let red = 0;
                for (let index = 0; index < png.data.length; index += 4) {
                  if (png.data[index] > 240 && png.data[index + 1] < 15 && png.data[index + 2] < 15) red++;
                }
                console.log(JSON.stringify({ headless, ...state, red, animationChanged: !first.equals(later) }));
              } finally { await browser.close(); }
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rendering-diagnostic
          path: arrakis-orbit/test-results/
