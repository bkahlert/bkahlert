name: Backgrounds

on:
  push:
    paths:
      - 'arrakis-desert/**'
      - 'arrakis-orbit/**'
      - '.github/workflows/backgrounds.yml'
  pull_request:
    paths:
      - 'arrakis-desert/**'
      - 'arrakis-orbit/**'
      - '.github/workflows/backgrounds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  background:
    name: ${{ matrix.project }} / Chromium and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [arrakis-desert, arrakis-orbit]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install project dependencies
        run: npm ci
      - name: Install Chromium, WebKit, and system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Verify checked-in generated artifacts
        run: npm run check:generated
      - name: Generate component and SVG backgrounds
        run: npm run build
      - name: Test all background formats
        run: npm test
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.project }}-failure-diagnostics
          path: |
            ${{ matrix.project }}/test-results/
            ${{ matrix.project }}/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
